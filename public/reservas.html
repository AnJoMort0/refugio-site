<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="./assets/icons/favicon.svg" type="image/svg+xml" />
  <title data-i18n="bookingPage.meta.title"></title>
  <meta
    name="description"
    content=""
    data-i18n-attr='{"content":"bookingPage.meta.description"}'
  />
  <link rel="stylesheet" href="./css/reset.css" />
  <link rel="stylesheet" href="./css/variables.css" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/mobile.css" />
  <link rel="stylesheet" href="./css/pages/reservas.css" />
</head>
<body data-page="booking">
  <div data-site-header></div>

  <main class="booking-page">
    <section class="section booking-page-intro">
      <div class="container content-column">
        <p class="eyebrow" data-i18n="bookingPage.hero.eyebrow"></p>
        <h1 data-i18n="bookingPage.hero.title"></h1>
        <p data-i18n="bookingPage.hero.text"></p>
      </div>
    </section>

    <section class="section booking-workspace-section">
      <div class="container booking-layout">
        <form id="booking-form" class="booking-form" action="./reserva-enviada.html" method="get" novalidate>
          <article class="booking-card booking-card-primary">
            <div class="booking-card-header">
              <p class="eyebrow" data-i18n="bookingPage.availability.eyebrow"></p>
              <h2 data-i18n="bookingPage.availability.title"></h2>
              <p data-i18n="bookingPage.availability.text"></p>
            </div>

            <div class="booking-date-fields">
              <label class="field">
                <span><span data-i18n="bookingPage.form.checkinLabel"></span><span class="required-mark" aria-hidden="true">*</span></span>
                <input id="checkin-date" name="checkin" type="date" required />
              </label>
              <label class="field">
                <span><span data-i18n="bookingPage.form.checkoutLabel"></span><span class="required-mark" aria-hidden="true">*</span></span>
                <input id="checkout-date" name="checkout" type="date" required />
              </label>
            </div>

            <p class="field-hint" data-i18n="bookingPage.form.dateHelp"></p>

            <div class="calendar-legend" aria-label="Legenda do calendário">
              <span><i class="legend-swatch is-available"></i><span data-i18n="bookingPage.availability.legendAvailable"></span></span>
              <span><i class="legend-swatch is-occupied"></i><span data-i18n="bookingPage.availability.legendOccupied"></span></span>
              <span><i class="legend-swatch is-selected"></i><span data-i18n="bookingPage.availability.legendSelected"></span></span>
            </div>

            <div id="availability-calendar" class="availability-calendar" aria-live="polite"></div>
          </article>

          <article class="booking-card">
            <div class="booking-card-header">
              <p class="eyebrow" data-i18n="bookingPage.guests.eyebrow"></p>
              <h2 data-i18n="bookingPage.guests.title"></h2>
            </div>

            <div class="guest-count-grid">
              <label class="field">
                <span><span data-i18n="bookingPage.form.adultsLabel"></span><span class="required-mark" aria-hidden="true">*</span></span>
                <input id="adult-count" name="adults" type="number" min="1" max="6" step="1" value="2" required />
              </label>
              <label class="field">
                <span data-i18n="bookingPage.form.kidsLabel"></span>
                <input id="child-count" name="children" type="number" min="0" max="5" step="1" value="0" />
              </label>
            </div>

            <p class="field-hint" data-i18n="bookingPage.form.guestCountHelp"></p>
            <p class="field-hint" data-i18n="bookingPage.form.guestCountHelp2"></p>

            <div id="bed-preference-group" class="dynamic-group" hidden>
              <div class="dynamic-group-header">
                <h3><span data-i18n="bookingPage.form.bedPreferenceTitle"></span><span class="required-mark" aria-hidden="true">*</span></h3>
              </div>
              <div class="booking-choice-grid" role="radiogroup" aria-label="Configuração das camas">
                <label class="booking-choice-card">
                  <input type="radio" name="bed_preference" value="double" />
                  <span class="booking-choice-copy">
                    <p data-i18n="bookingPage.form.bedPreferenceDouble"></p>
                  </span>
                </label>
                <label class="booking-choice-card">
                  <input type="radio" name="bed_preference" value="single" />
                  <span class="booking-choice-copy">
                    <p data-i18n="bookingPage.form.bedPreferenceSingle"></p>
                  </span>
                </label>
              </div>
            </div>

            <div id="child-ages-group" class="dynamic-group" hidden>
              <div class="dynamic-group-header">
                <h3 data-i18n="bookingPage.form.childAgesTitle"></h3>
                <p data-i18n="bookingPage.form.childAgesText"></p>
              </div>
              <div id="child-ages-fields" class="dynamic-grid compact-age-grid"></div>
            </div>
          </article>

          <article class="booking-card">
            <label class="booking-toggle">
              <input id="bike-reservation-toggle" name="bike_reservation" type="checkbox" />
              <span class="booking-toggle-control" aria-hidden="true"></span>
              <span class="booking-toggle-copy">
                <strong data-i18n="bookingPage.form.bikeToggleLabel"></strong>
                <small data-i18n="bookingPage.form.bikeToggleHelp"></small>
              </span>
            </label>

            <div id="bike-days-group" class="dynamic-group" hidden>
              <div class="dynamic-group-header">
                <h3 data-i18n="bookingPage.form.bikeDaysTitle"></h3>
                <p data-i18n="bookingPage.form.bikeDaysText"></p>
              </div>
              <div class="booking-date-fields">
                <label class="field">
                  <span data-i18n="bookingPage.form.bikeCountLabel"></span>
                  <input id="bike-count" name="bike_count" type="number" min="1" max="2" step="1" value="1" />
                </label>
                <label class="field">
                  <span data-i18n="bookingPage.form.bikeRentalDaysLabel"></span>
                  <input id="bike-rental-days" name="bike_rental_days" type="number" min="1" max="1" step="1" value="1" />
                </label>
              </div>
            </div>
          </article>

          <article class="booking-card">
            <div class="booking-card-header">
              <p class="eyebrow" data-i18n="bookingPage.details.eyebrow"></p>
              <h2 data-i18n="bookingPage.details.title"></h2>
            </div>

            <div class="dynamic-group">
              <div class="dynamic-group-header">
                <h3 data-i18n="bookingPage.form.contactTitle"></h3>
              </div>

              <div class="booking-contact-grid booking-contact-grid-wide">
                <label class="field">
                  <span><span data-i18n="bookingPage.form.contactNameLabel"></span><span class="required-mark" aria-hidden="true">*</span></span>
                  <input
                    id="contact-name"
                    name="contact_name"
                    type="text"
                    autocomplete="name"
                    required
                    placeholder=""
                    data-i18n-attr='{"placeholder":"bookingPage.form.contactNamePlaceholder"}'
                  />
                </label>
                <label class="field">
                  <span><span data-i18n="bookingPage.form.emailLabel"></span><span class="required-mark" aria-hidden="true">*</span></span>
                  <input
                    id="contact-email"
                    name="contact_email"
                    type="email"
                    autocomplete="email"
                    required
                    placeholder=""
                    data-i18n-attr='{"placeholder":"bookingPage.form.emailPlaceholder"}'
                  />
                </label>
                <label class="field">
                  <span data-i18n="bookingPage.form.phoneLabel"></span>
                  <input
                    id="contact-phone"
                    name="contact_phone"
                    type="tel"
                    autocomplete="tel"
                    placeholder=""
                    data-i18n-attr='{"placeholder":"bookingPage.form.phonePlaceholder"}'
                  />
                </label>
              </div>

              <p class="field-hint field-warning" data-i18n="bookingPage.form.confirmationWarning"></p>
            </div>

            <div class="booking-time-grid">
              <label class="field">
                <span data-i18n="bookingPage.form.checkinTimeLabel"></span>
                <input id="checkin-time" name="checkin_time" type="time" min="15:00" max="19:00" />
              </label>
              <label class="field">
                <span data-i18n="bookingPage.form.checkoutTimeLabel"></span>
                <input id="checkout-time" name="checkout_time" type="time" min="08:00" max="10:00" />
              </label>
            </div>

            <p class="field-hint" data-i18n="bookingPage.form.timeRangeHelp"></p>
            <p class="field-hint" data-i18n="bookingPage.form.timeHelp"></p>
            <p class="field-hint field-warning" data-i18n="bookingPage.form.timezoneWarning" hidden></p>

            <label class="booking-toggle">
              <input id="deposit-prepay" name="deposit_prepay" type="checkbox" />
              <span class="booking-toggle-control" aria-hidden="true"></span>
              <span class="booking-toggle-copy">
                <strong data-i18n="bookingPage.form.depositToggleLabel"></strong>
                <small data-i18n="bookingPage.form.depositToggleHelp"></small>
              </span>
            </label>

            <label class="field">
              <span data-i18n="bookingPage.form.discountCodeLabel"></span>
              <input
                id="discount-code"
                name="discount_code"
                type="text"
                autocomplete="off"
                autocapitalize="characters"
                placeholder=""
                data-i18n-attr='{"placeholder":"bookingPage.form.discountCodePlaceholder"}'
              />
            </label>

            <label class="field field-textarea">
              <span data-i18n="bookingPage.form.commentsLabel"></span>
              <textarea
                id="reservation-comments"
                name="comments"
                rows="5"
                placeholder=""
                data-i18n-attr='{"placeholder":"bookingPage.form.commentsPlaceholder"}'
              ></textarea>
            </label>

            <div id="booking-form-status" class="booking-form-status" role="alert" hidden></div>

            <label class="booking-confirmation booking-marketing-toggle">
              <input id="booking-marketing-opt-in" name="marketing_opt_in" type="checkbox" value="true" />
              <span class="booking-confirmation-control" aria-hidden="true"></span>
              <span class="booking-confirmation-copy">
                <strong data-i18n="bookingPage.form.marketingOptInLabel"></strong>
              </span>
            </label>

            <label class="booking-confirmation">
              <input id="rules-confirmation" name="rules_confirmation" type="checkbox" required />
              <span class="booking-confirmation-control" aria-hidden="true"></span>
              <span class="booking-confirmation-copy">
                <strong><span data-i18n="bookingPage.form.rulesConfirmLabel"></span><span class="required-mark" aria-hidden="true">*</span></strong>
                <small>
                  <span data-i18n="bookingPage.form.rulesConfirmHelp"></span>
                  <a class="text-link inline-text-link" href="#booking-rules" data-i18n="bookingPage.form.rulesLink"></a>
                </small>
              </span>
            </label>

            <p class="field-hint field-warning booking-submit-notice" data-i18n="bookingPage.form.submitNotice"></p>

            <div class="booking-form-actions">
              <button class="button booking-submit-button" type="submit" data-i18n="bookingPage.form.submit"></button>
              <button class="button booking-reset-button" type="button" id="booking-reset" data-i18n="bookingPage.form.reset"></button>
            </div>
          </article>
        </form>

        <aside class="booking-sidebar">
          <article class="booking-card booking-summary-card">
            <div class="booking-card-header">
              <p class="eyebrow" data-i18n="bookingPage.summary.eyebrow"></p>
              <h2 data-i18n="bookingPage.summary.title"></h2>
            </div>

            <dl class="summary-rates" id="summary-rates" hidden>
              <div>
                <dt data-i18n="bookingPage.summary.rateAdultLabel"></dt>
                <dd data-price-adult></dd>
              </div>
              <div id="summary-child-rate" hidden>
                <dt data-i18n="bookingPage.summary.rateChildLabel"></dt>
                <dd data-price-child></dd>
              </div>
              <div id="summary-bike-rate" hidden>
                <dt data-i18n="bookingPage.summary.rateBikeLabel"></dt>
                <dd data-price-bike></dd>
              </div>
              <div id="summary-deposit-rate" hidden>
                <dt data-i18n="bookingPage.summary.depositLabel"></dt>
                <dd data-price-deposit></dd>
              </div>
            </dl>

            <dl class="summary-breakdown">
              <div>
                <dt data-i18n="bookingPage.summary.nightsLabel"></dt>
                <dd id="summary-nights">0</dd>
              </div>
              <div>
                <dt data-i18n="bookingPage.summary.guestsLabel"></dt>
                <dd id="summary-guests">2</dd>
              </div>
              <div>
                <dt data-i18n="bookingPage.summary.adultsLabel"></dt>
                <dd id="summary-adults">2</dd>
              </div>
              <div>
                <dt data-i18n="bookingPage.summary.kidsLabel"></dt>
                <dd id="summary-kids">0</dd>
              </div>
              <div>
                <dt data-i18n="bookingPage.summary.depositChoiceLabel"></dt>
                <dd id="summary-deposit-choice"></dd>
              </div>
              <div id="summary-bikes-row" hidden>
                <dt data-i18n="bookingPage.summary.bikesLabel"></dt>
                <dd id="summary-bikes"></dd>
              </div>
              <div id="summary-discount-row" hidden>
                <dt data-i18n="bookingPage.summary.discountLabel"></dt>
                <dd id="summary-discount">-</dd>
              </div>
              <div id="summary-bed-preference-row" hidden>
                <dt data-i18n="bookingPage.summary.bedPreferenceLabel"></dt>
                <dd id="summary-bed-preference">-</dd>
              </div>
            </dl>

            <div class="summary-total" id="summary-total-row" hidden>
              <span data-i18n="bookingPage.summary.estimatedTotalLabel"></span>
              <strong id="summary-total"></strong>
            </div>

            <p class="summary-note" data-i18n="bookingPage.summary.note"></p>
            <p id="summary-deposit-note" class="summary-note" data-i18n="bookingPage.summary.depositNote" hidden></p>
          </article>

          <article class="booking-card booking-contact-card">
            <div class="booking-card-header">
              <p class="eyebrow" data-i18n="bookingPage.contact.eyebrow"></p>
              <h2 data-i18n="bookingPage.contact.title"></h2>
              <p data-i18n="bookingPage.contact.text"></p>
            </div>
            <div class="booking-contact-methods">
              <a class="button booking-contact-button" href="./contacto.html" data-i18n="bookingPage.contact.button"></a>
            </div>
          </article>
        </aside>
      </div>
    </section>

    <section id="booking-rules" class="section section-alt booking-rules-section">
      <div class="container">
        <div class="section-heading content-column">
          <p class="eyebrow" data-i18n="rulesFull.eyebrow"></p>
          <h2 data-i18n="rulesFull.title"></h2>
          <p data-i18n="rulesFull.intro"></p>
        </div>

        <div class="rules-grid">
          <article class="rule-card">
            <h3 data-i18n="rulesFull.capacity.title"></h3>
            <ul>
              <li data-i18n="rulesFull.capacity.item1"></li>
              <li data-i18n="rulesFull.capacity.item2"></li>
              <li data-i18n="rulesFull.capacity.item3"></li>
            </ul>
            <p class="rule-note rule-note-warning" data-i18n="rulesFull.capacity.note"></p>
          </article>

          <article class="rule-card">
            <h3 data-i18n="rulesFull.checkin.title"></h3>
            <ul>
              <li data-i18n="rulesFull.checkin.item1"></li>
              <li data-i18n="rulesFull.checkin.item2"></li>
              <li data-i18n="rulesFull.checkin.item3"></li>
              <li data-i18n="rulesFull.checkin.item4"></li>
            </ul>
            <p class="rule-note" data-i18n="rulesFull.checkin.note"></p>
          </article>

          <article class="rule-card">
            <h3 data-i18n="rulesFull.reservation.title"></h3>
            <ul>
              <li data-i18n="rulesFull.reservation.item1"></li>
              <li data-i18n="rulesFull.reservation.item2"></li>
              <li data-i18n="rulesFull.reservation.item3"></li>
            </ul>
          </article>

          <article class="rule-card">
            <h3 data-i18n="rulesFull.deposit.title"></h3>
            <ul>
              <li data-i18n="rulesFull.deposit.item1"></li>
              <li data-i18n="rulesFull.deposit.item2"></li>
              <li data-i18n="rulesFull.deposit.item3"></li>
            </ul>
          </article>

          <article class="rule-card">
            <h3 data-i18n="rulesFull.identification.title"></h3>
            <ul>
              <li data-i18n="rulesFull.identification.item1"></li>
              <li data-i18n="rulesFull.identification.item2"></li>
            </ul>
          </article>

          <article class="rule-card">
            <h3 data-i18n="rulesFull.parking.title"></h3>
            <ul>
              <li data-i18n="rulesFull.parking.item1"></li>
              <li data-i18n="rulesFull.parking.item2"></li>
            </ul>
            <p class="rule-note" data-i18n="rulesFull.parking.note"></p>
          </article>

          <article class="rule-card rule-card-alert">
            <h3 data-i18n="rulesFull.rules.title"></h3>
            <ul>
              <li data-i18n="rulesFull.rules.item1"></li>
              <li data-i18n="rulesFull.rules.item2"></li>
              <li data-i18n="rulesFull.rules.item3"></li>
              <li data-i18n="rulesFull.rules.item4"></li>
            </ul>
          </article>

          <article class="rule-card">
            <h3 data-i18n="rulesFull.smoking.title"></h3>
            <ul>
              <li data-i18n="rulesFull.smoking.item1"></li>
              <li data-i18n="rulesFull.smoking.item2"></li>
            </ul>
            <p class="rule-note rule-note-warning" data-i18n="rulesFull.smoking.note"></p>
          </article>

          <article class="rule-card">
            <h3 data-i18n="rulesFull.cleaning.title"></h3>
            <ul>
              <li data-i18n="rulesFull.cleaning.item1"></li>
              <li data-i18n="rulesFull.cleaning.item2"></li>
            </ul>
            <p class="rule-note" data-i18n="rulesFull.cleaning.note"></p>
          </article>

          <article class="rule-card">
            <h3 data-i18n="rulesFull.pool.title"></h3>
            <ul>
              <li data-i18n="rulesFull.pool.item1"></li>
              <li data-i18n="rulesFull.pool.item2"></li>
            </ul>
            <p class="rule-note" data-i18n="rulesFull.pool.note"></p>
          </article>

          <article class="rule-card">
            <h3 data-i18n="rulesFull.security.title"></h3>
            <ul>
              <li data-i18n="rulesFull.security.item1"></li>
              <li data-i18n="rulesFull.security.item2"></li>
            </ul>
            <p class="rule-note" data-i18n="rulesFull.security.note"></p>
          </article>

          <article class="rule-card">
            <h3 data-i18n="rulesFull.legal.title"></h3>
            <ul>
              <li data-i18n="rulesFull.legal.item1"></li>
              <li data-i18n="rulesFull.legal.item2"></li>
            </ul>
          </article>
        </div>
      </div>
    </section>
  </main>

  <div data-site-footer></div>
  <div data-sticky-booking></div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
