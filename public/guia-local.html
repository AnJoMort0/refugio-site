<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="icon" href="./assets/icons/favicon.svg" type="image/svg+xml" />
  <title data-i18n="guidePage.meta.title"></title>
  <meta name="description" content="" data-i18n-attr='{"content":"guidePage.meta.description"}' />
  <link rel="stylesheet" href="./css/reset.css" />
  <link rel="stylesheet" href="./css/variables.css" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/mobile.css" />
  <link rel="stylesheet" href="./css/pages/guia-local.css" />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
</head>
<body data-page="guide">
  <div data-site-header></div>

  <main>
    <section class="hero guide-hero">
      <div class="hero-media">
        <img
          src="./assets/images/guide/lomba.jpg"
          alt=""
          data-i18n-attr='{"alt":"guidePage.hero.imageAlt"}'
        />
      </div>
      <div class="hero-overlay"></div>
      <div class="container hero-content">
        <p class="eyebrow" data-i18n="guidePage.hero.eyebrow"></p>
        <h1 data-i18n="guidePage.hero.title"></h1>
        <p class="hero-text" data-i18n="guidePage.hero.text"></p>
        <div class="hero-actions">
          <a class="button button-primary" href="#descobrir" data-i18n="guidePage.hero.primaryCta"></a>
          <a class="button button-secondary" href="#mapa" data-guide-open-map data-i18n="guidePage.hero.mapCta"></a>
        </div>
      </div>
    </section>
    <section class="section guide-browser-section" id="descobrir">
      <div class="container">
        <div class="section-heading">
          <p class="eyebrow" data-i18n="guidePage.browser.eyebrow"></p>
          <h2 data-i18n="guidePage.browser.title"></h2>
          <p data-i18n="guidePage.browser.text1"></p>
          <p data-i18n="guidePage.browser.text2"></p>
        </div>

        <div class="guide-toolbar" data-guide-toolbar>
          <label class="guide-search">
            <span class="sr-only" data-i18n="guidePage.browser.searchLabel"></span>
            <svg class="lucide-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.3-4.3"></path>
            </svg>
            <input type="search" data-guide-search data-i18n-attr='{"placeholder":"guidePage.browser.searchPlaceholder","aria-label":"guidePage.browser.searchLabel"}' />
          </label>

          <div class="guide-filter-row" role="group" data-i18n-attr='{"aria-label":"guidePage.browser.filterLabel"}'>
            <button type="button" class="guide-filter is-active" data-guide-filter="all" aria-pressed="true" data-i18n="guidePage.browser.all"></button>
            <button type="button" class="guide-filter" data-guide-filter="beaches" aria-pressed="false" data-i18n="guidePage.browser.beaches"></button>
            <button type="button" class="guide-filter" data-guide-filter="nature" aria-pressed="false" data-i18n="guidePage.browser.nature"></button>
            <button type="button" class="guide-filter" data-guide-filter="cities" aria-pressed="false" data-i18n="guidePage.browser.cities"></button>
            <button type="button" class="guide-filter" data-guide-filter="nearby" aria-pressed="false" data-i18n="guidePage.browser.nearby"></button>
            <button type="button" class="guide-filter" data-guide-filter="events" aria-pressed="false" data-i18n="guidePage.browser.events"></button>
            <button type="button" class="guide-filter" data-guide-filter="favourites" aria-pressed="false" data-i18n="guidePage.browser.favourites"></button>
          </div>

          <div class="guide-toolbar-controls">
            <label class="guide-sort">
              <span data-i18n="guidePage.browser.sortLabel"></span>
              <select data-guide-sort>
                <option value="closest" data-i18n="guidePage.browser.sortClosest"></option>
                <option value="alpha" data-i18n="guidePage.browser.sortAlpha"></option>
              </select>
            </label>

            <button type="button" class="guide-location-button" data-guide-location>
              <svg class="lucide-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a8 8 0 1 0-4.4 4.4"></path>
                <path d="M22 22 18 18"></path>
              </svg>
              <span data-guide-location-label data-i18n="guidePage.browser.useLocation"></span>
            </button>
          </div>
        </div>

        <p class="guide-privacy-note" data-i18n="guidePage.browser.privacyNote"></p>
        <p class="guide-location-status" data-guide-location-status role="status" aria-live="polite"></p>

        <div class="guide-browser-meta">
          <p data-guide-results-count aria-live="polite"></p>
          <div class="guide-view-toggle" role="group" aria-label="" data-i18n-attr='{"aria-label":"guidePage.browser.viewLabel"}'>
            <button type="button" class="guide-view-button" data-guide-view="list" aria-pressed="false">
              <svg class="lucide-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M8 6h13"></path><path d="M8 12h13"></path><path d="M8 18h13"></path>
                <path d="M3 6h.01"></path><path d="M3 12h.01"></path><path d="M3 18h.01"></path>
              </svg>
              <span data-i18n="guidePage.browser.listView"></span>
            </button>
            <button type="button" class="guide-view-button is-active" data-guide-view="map" aria-pressed="true">
              <svg class="lucide-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m9 18-6 3V6l6-3 6 3 6-3v15l-6 3-6-3Z"></path>
                <path d="M9 3v15"></path><path d="M15 6v15"></path>
              </svg>
              <span data-i18n="guidePage.browser.mapView"></span>
            </button>
          </div>
        </div>

        <div class="guide-browser is-map-view" data-guide-browser>
          <div class="guide-list-pane">
            <div class="guide-list" data-guide-results>
              <p class="guide-loading" data-i18n="guidePage.browser.loading"></p>
            </div>
            <div class="guide-load-more" data-guide-load-more-wrap hidden>
              <button class="button button-secondary" type="button" data-guide-load-more></button>
            </div>
            <div class="guide-empty card" data-guide-empty hidden>
              <h3 data-i18n="guidePage.browser.noResultsTitle"></h3>
              <p data-i18n="guidePage.browser.noResultsText"></p>
            </div>
          </div>

          <aside class="guide-map-card card" id="mapa" data-guide-map>
            <div class="guide-map-copy">
              <p class="eyebrow" data-i18n="guidePage.map.eyebrow"></p>
              <h3 data-guide-map-title data-i18n="guidePage.map.title"></h3>
              <p data-i18n="guidePage.map.text"></p>
            </div>
            <div class="guide-map-frame">
              <div
                class="guide-interactive-map"
                data-guide-map-canvas
                role="region"
                tabindex="0"
                data-i18n-attr='{"aria-label":"guidePage.map.defaultTitle"}'
              ></div>
            </div>
            <div class="guide-map-actions">
              <div class="guide-map-action-row">
                <a
                  class="button button-primary"
                  href="#"
                  target="_blank"
                  rel="noopener"
                  data-guide-map-link
                  data-site-link="maps"
                  data-i18n="guidePage.map.openDefault"
                ></a>
                <div class="guide-map-legend" data-guide-map-legend></div>
              </div>
              <p data-guide-map-fallback data-i18n="guidePage.labels.mapUnavailable" hidden></p>
            </div>
          </aside>
        </div>

        <p class="guide-event-note" data-i18n="guidePage.events.dateNote"></p>

      </div>
    </section>

    <section class="section section-alt guide-partners-section">
      <div class="container">
        <div class="section-heading">
          <p class="eyebrow" data-i18n="guidePage.partners.eyebrow"></p>
          <h2 data-i18n="guidePage.partners.title"></h2>
          <p data-i18n="guidePage.partners.text"></p>
        </div>
        <div class="guide-partner-grid" data-guide-partners></div>
        <p class="guide-partner-note" data-i18n="guidePage.partners.offerNote"></p>
      </div>
    </section>

    <section class="section guide-final-section">
      <div class="container card guide-final-card">
        <div>
          <p class="eyebrow" data-i18n="guidePage.finalCta.eyebrow"></p>
          <h2 data-i18n="guidePage.finalCta.title"></h2>
          <p data-i18n="guidePage.finalCta.text"></p>
        </div>
        <div class="guide-final-actions">
          <a class="text-link" href="./alojamento.html" data-i18n="guidePage.finalCta.accommodation"></a>
          <a class="button button-primary" href="./reservas.html" data-i18n="guidePage.finalCta.booking"></a>
        </div>
      </div>
    </section>
  </main>

  <div data-site-footer></div>
  <div data-sticky-booking></div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
