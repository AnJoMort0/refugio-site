<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="contactPage.meta.title"></title>
  <meta
    name="description"
    content=""
    data-i18n-attr='{"content":"contactPage.meta.description"}'
  />
  <link rel="stylesheet" href="./css/reset.css" />
  <link rel="stylesheet" href="./css/variables.css" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/mobile.css" />
  <link rel="stylesheet" href="./css/pages/contacto.css" />
</head>
<body data-page="contact">
  <div data-site-header></div>
  <main class="contact-page">
    <section class="section contact-page-intro">
      <div class="container content-column">
        <p class="eyebrow" data-i18n="contactPage.hero.eyebrow"></p>
        <h1 data-i18n="contactPage.hero.title"></h1>
        <p data-i18n="contactPage.hero.text"></p>
        <div class="contact-hero-actions">
          <a class="button button-primary" href="#mensagem" data-i18n="contactPage.hero.primaryCta"></a>
          <a class="button contact-secondary-button" href="https://www.google.com/maps/place/O+Ref%C3%BAgio/@41.0204811,-8.3871842,646m/data=!3m2!1e3!4b1!4m6!3m5!1s0xd24830c21a7821f:0x7babb9259b50311a!8m2!3d41.0204812!4d-8.3823133!16s%2Fg%2F11vqhfvg0k?entry=ttu&g_ep=EgoyMDI2MDQyMC4wIKXMDSoASAFQAw%3D%3D" target="_blank" rel="noopener" data-i18n="contactPage.hero.reviewCta"></a>
        </div>
      </div>
    </section>

    <section id="mensagem" class="section section-alt contact-message-section">
      <div class="container contact-layout">
        <form class="contact-card contact-form" action="./obrigado.html" method="get" novalidate>
          <div class="contact-card-header">
            <p class="eyebrow" data-i18n="contactPage.form.eyebrow"></p>
            <h2 data-i18n="contactPage.form.title"></h2>
            <p data-i18n="contactPage.form.text"></p>
          </div>

          <div class="contact-field-grid">
            <label class="field">
              <span><span data-i18n="contactPage.form.nameLabel"></span><span class="required-mark" aria-hidden="true">*</span></span>
              <input name="name" type="text" autocomplete="name" required placeholder="" data-i18n-attr='{"placeholder":"contactPage.form.namePlaceholder"}' />
            </label>
            <label class="field">
              <span><span data-i18n="contactPage.form.emailLabel"></span><span class="required-mark" aria-hidden="true">*</span></span>
              <input name="email" type="email" autocomplete="email" required placeholder="" data-i18n-attr='{"placeholder":"contactPage.form.emailPlaceholder"}' />
            </label>
            <label class="field">
              <span data-i18n="contactPage.form.phoneLabel"></span>
              <input id="contact-phone" name="phone" type="tel" autocomplete="tel" placeholder="" data-i18n-attr='{"placeholder":"contactPage.form.phonePlaceholder"}' />
            </label>
          </div>

          <div class="contact-field-grid">
            <label class="field">
              <span><span data-i18n="contactPage.form.languageLabel"></span><span class="required-mark" aria-hidden="true">*</span></span>
              <select id="contact-language" name="contact_language" required>
                <option value="pt" data-i18n="contactPage.form.languagePortuguese"></option>
                <option value="fr" data-i18n="contactPage.form.languageFrench"></option>
                <option value="en" data-i18n="contactPage.form.languageEnglish"></option>
                <option value="de" data-i18n="contactPage.form.languageGerman"></option>
                <option value="es" data-i18n="contactPage.form.languageSpanish"></option>
              </select>
            </label>
            <label class="field">
              <span><span data-i18n="contactPage.form.preferredContactLabel"></span><span class="required-mark" aria-hidden="true">*</span></span>
              <select id="preferred-contact" name="preferred_contact" required>
                <option value="email" data-i18n="contactPage.form.preferredEmail"></option>
                <option value="whatsapp_request" data-requires-phone data-i18n="contactPage.form.preferredWhatsApp"></option>
                <option value="callback_request" data-requires-phone data-i18n="contactPage.form.preferredCall"></option>
              </select>
            </label>
            <label class="field">
              <span><span data-i18n="contactPage.form.contextLabel"></span><span class="required-mark" aria-hidden="true">*</span></span>
              <select id="contact-context" name="context">
                <option value="" data-i18n="contactPage.form.contextPlaceholder"></option>
                <option value="confirmed" data-i18n="contactPage.form.contextConfirmed"></option>
                <option value="requested" data-i18n="contactPage.form.contextRequested"></option>
                <option value="past" data-i18n="contactPage.form.contextPast"></option>
                <option value="none" data-i18n="contactPage.form.contextNone"></option>
              </select>
            </label>
            <label class="field">
              <span><span data-i18n="contactPage.form.topicLabel"></span><span class="required-mark" aria-hidden="true">*</span></span>
              <select id="contact-topic" name="topic" disabled>
                <option value="" data-i18n="contactPage.form.topicContextFirst"></option>
              </select>
            </label>
          </div>

          <label class="field field-textarea">
            <span><span data-i18n="contactPage.form.messageLabel"></span><span class="required-mark" aria-hidden="true">*</span></span>
            <textarea name="message" rows="7" required placeholder="" data-i18n-attr='{"placeholder":"contactPage.form.messagePlaceholder"}'></textarea>
          </label>

          <div class="field contact-file-field">
            <span id="contact-attachments-label" data-i18n="contactPage.form.attachmentsLabel"></span>
            <div class="contact-file-picker">
              <input id="contact-attachments" class="contact-file-input" name="attachments" type="file" multiple accept="image/*,.pdf,.doc,.docx,.txt" aria-labelledby="contact-attachments-label" aria-describedby="contact-attachments-help contact-attachment-summary" />
              <label class="button contact-secondary-button contact-file-button" for="contact-attachments" role="button" tabindex="0" data-contact-attachment-button data-i18n="contactPage.form.attachmentsButton"></label>
              <span id="contact-attachment-summary" class="contact-file-summary" data-i18n="contactPage.form.attachmentsEmpty"></span>
            </div>
            <small id="contact-attachments-help" class="field-hint" data-i18n="contactPage.form.attachmentsHelp"></small>
            <ul id="contact-attachment-list" class="contact-attachment-list" aria-live="polite" hidden></ul>
          </div>

          <div id="contact-form-status" class="contact-form-status" role="alert" hidden></div>

          <label class="contact-consent">
            <input id="contact-marketing-opt-in" name="marketing_opt_in" type="checkbox" value="true" />
            <span class="contact-consent-control" aria-hidden="true"></span>
            <span class="contact-consent-copy">
              <strong data-i18n="contactPage.form.marketingOptInLabel"></strong>
            </span>
          </label>

          <div class="contact-form-actions">
            <button class="button button-primary" type="submit" data-i18n="contactPage.form.submit"></button>
          </div>
        </form>

        <aside class="contact-side">
          <section class="contact-card contact-stay-card">
            <p class="eyebrow" data-i18n="contactPage.stay.eyebrow"></p>
            <h2 data-i18n="contactPage.stay.title"></h2>
            <p data-i18n="contactPage.stay.text"></p>
          </section>

          <section class="contact-card contact-social-card">
            <p class="eyebrow" data-i18n="contactPage.social.eyebrow"></p>
            <h2 data-i18n="contactPage.social.title"></h2>
            <div class="contact-social-links">
              <a class="button contact-secondary-button" href="https://www.google.com/maps/place/O+Ref%C3%BAgio/@41.0204811,-8.3871842,646m/data=!3m2!1e3!4b1!4m6!3m5!1s0xd24830c21a7821f:0x7babb9259b50311a!8m2!3d41.0204812!4d-8.3823133!16s%2Fg%2F11vqhfvg0k?entry=ttu&g_ep=EgoyMDI2MDQyMC4wIKXMDSoASAFQAw%3D%3D" target="_blank" rel="noopener" data-i18n="contactPage.social.googleMaps"></a>
              <a class="button contact-secondary-button" href="https://example.com/REFUGIO_FACEBOOK_URL_REPLACE_ME" target="_blank" rel="noopener" data-i18n="contactPage.social.facebook"></a>
              <a class="button contact-secondary-button" href="https://example.com/REFUGIO_INSTAGRAM_URL_REPLACE_ME" target="_blank" rel="noopener" data-i18n="contactPage.social.instagram"></a>
            </div>
          </section>
        </aside>
      </div>
    </section>
  </main>
  <div data-site-footer></div>
  <div data-sticky-booking></div>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
