<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="meta.title"></title>
  <meta name="description" content="" data-i18n-attr='{"content":"meta.description"}' />
  <link rel="stylesheet" href="./css/reset.css" />
  <link rel="stylesheet" href="./css/variables.css" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/mobile.css" />
  <link rel="stylesheet" href="./css/pages/home.css" />
</head>
<body data-page="home">
  <div data-site-header></div>

  <main>
    <section class="hero">
      <div class="hero-media">
        <img
          src="./assets/images/hero_exterior_stone_house.jpg"
          alt=""
          data-i18n-attr='{"alt":"home.hero.imageAlt"}'
        />
      </div>
      <div class="hero-overlay"></div>
      <div class="container hero-content">
        <p class="eyebrow" data-i18n="home.hero.eyebrow"></p>
        <h1 data-i18n="home.hero.title"></h1>
        <p class="hero-text" data-i18n="home.hero.text"></p>
        <div class="hero-actions">
          <a class="button button-primary" href="./reservas.html" data-i18n="home.hero.primaryCta"></a>
          <a class="button button-secondary" href="./galeria.html" data-i18n="home.hero.secondaryCta"></a>
        </div>
      </div>
    </section>


    <section class="section accommodation-intro">
      <div class="container content-column">
        <div>
          <p class="eyebrow" data-i18n="home.accommodation.eyebrow"></p>
          <h2 data-i18n="home.accommodation.title"></h2>
          <p data-i18n="home.accommodation.text1"></p>
          <p data-i18n="home.accommodation.text2"></p>
          <p class="home-address">
            <strong data-i18n="home.location.label"></strong>
            <a
              class="home-address-link"
              href="https://www.google.com/maps/place/O+Ref%C3%BAgio/@41.0205166,-8.3828538,108m/data=!3m1!1e3!4m6!3m5!1s0xd24830c21a7821f:0x7babb9259b50311a!8m2!3d41.0204812!4d-8.3823133!16s%2Fg%2F11vqhfvg0k?entry=ttu"
              target="_blank"
              rel="noopener"
              data-i18n-attr='{"aria-label":"home.location.mapLink"}'
            >
              <svg class="lucide-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path>
                <circle cx="12" cy="10" r="3"></circle>
              </svg>
              <span data-i18n="home.location.address"></span>
            </a>
          </p>
          <a class="text-link" href="./alojamento.html" data-i18n="home.accommodation.link"></a>
        </div>
      </div>
    </section>

    <section class="section section-alt">
      <div class="container">
        <div class="section-heading">
          <p class="eyebrow" data-i18n="home.gallery.eyebrow"></p>
          <h2 data-i18n="home.gallery.title"></h2>
        </div>
        <div class="carousel gallery-carousel" data-carousel>
          <article class="gallery-card carousel-card">
            <img
              src="./assets/images/living_room.jpg"
              alt=""
              data-i18n-attr='{"alt":"home.gallery.card4Alt"}'
            />
            <p data-i18n="home.gallery.card4"></p>
          </article>
          <article class="gallery-card">
            <img
              src="./assets/images/pool_mountain_view.jpg"
              alt=""
              data-i18n-attr='{"alt":"home.gallery.card1Alt"}'
            />
            <p data-i18n="home.gallery.card1"></p>
          </article>
          <article class="gallery-card">
            <img
              src="./assets/images/night_pool_lighting.jpg"
              alt=""
              data-i18n-attr='{"alt":"home.gallery.card2Alt"}'
            />
            <p data-i18n="home.gallery.card2"></p>
          </article>
          <article class="gallery-card">
            <img
              src="./assets/images/local_mountain_trail.jpg"
              alt=""
              data-i18n-attr='{"alt":"home.gallery.card3Alt"}'
            />
            <p data-i18n="home.gallery.card3"></p>
          </article>
        </div>
        <a class="text-link section-cta" href="./galeria.html" data-i18n="home.gallery.link"></a>
      </div>
    </section>

    <section class="section booking-teaser">
      <div class="container card booking-card">
        <div>
          <p class="eyebrow" data-i18n="home.booking.eyebrow"></p>
          <h2 data-i18n="home.booking.title"></h2>
          <p data-i18n="home.booking.text"></p>
        </div>
        <a class="button button-primary" href="./reservas.html" data-i18n="home.booking.cta"></a>
      </div>
    </section>

    <section class="section">
      <div class="container two-column reverse-mobile">
        <div>
          <p class="eyebrow" data-i18n="home.local.eyebrow"></p>
          <h2 data-i18n="home.local.title"></h2>
          <p data-i18n="home.local.text1"></p>
          <a class="text-link" href="./guia-local.html" data-i18n="home.local.link"></a>
        </div>
        <div class="image-card">
          <img
            src="./assets/images/surroundings/river_spot.jpg"
            alt=""
            data-i18n-attr='{"alt":"home.local.imageAlt"}'
          />
        </div>
      </div>
    </section>

    <section class="section section-alt">
      <div class="container">
        <div class="section-heading">
          <p class="eyebrow" data-i18n="home.testimonials.eyebrow"></p>
          <h2 data-i18n="home.testimonials.title"></h2>
          <div class="section-cta-group">
            <a class="text-link section-cta" href="https://www.google.com/maps/place/O+Ref%C3%BAgio/@41.0204811,-8.3871842,646m/data=!3m2!1e3!4b1!4m6!3m5!1s0xd24830c21a7821f:0x7babb9259b50311a!8m2!3d41.0204812!4d-8.3823133!16s%2Fg%2F11vqhfvg0k?entry=ttu&g_ep=EgoyMDI2MDQyMC4wIKXMDSoASAFQAw%3D%3D" target="_blank" rel="noopener" data-i18n="home.testimonials.reviewCta"></a>
            <a class="text-link section-cta" href="./contacto.html?context=past&topic=pastFeedback#mensagem" data-i18n="home.testimonials.reviewCta2"></a>
          </div>
        </div>
        <div class="carousel testimonial-carousel" data-carousel>
          <article class="card testimonial-card carousel-card">
            <p data-i18n="home.testimonials.quote1"></p>
            <span data-i18n="home.testimonials.author1"></span>
          </article>
          <article class="card testimonial-card carousel-card">
            <p data-i18n="home.testimonials.quote2"></p>
            <span data-i18n="home.testimonials.author2"></span>
          </article>
          <article class="card testimonial-card carousel-card">
            <p data-i18n="home.testimonials.quote3"></p>
            <span data-i18n="home.testimonials.author3"></span>
          </article>
          <article class="card testimonial-card carousel-card">
            <p data-i18n="home.testimonials.quote4"></p>
            <span data-i18n="home.testimonials.author4"></span>
          </article>
          <article class="card testimonial-card carousel-card">
            <p data-i18n="home.testimonials.quote5"></p>
            <span data-i18n="home.testimonials.author5"></span>
          </article>
          <article class="card testimonial-card carousel-card">
            <p data-i18n="home.testimonials.quote6"></p>
            <span data-i18n="home.testimonials.author6"></span>
          </article>
          <article class="card testimonial-card carousel-card">
            <p data-i18n="home.testimonials.quote7"></p>
            <span data-i18n="home.testimonials.author7"></span>
          </article>
          <article class="card testimonial-card carousel-card">
            <p data-i18n="home.testimonials.quote8"></p>
            <span data-i18n="home.testimonials.author8"></span>
          </article>
        </div>
      </div>
    </section>

    <section class="section sponsor-teaser-section">
      <div class="container sponsor-teaser">
        <div class="sponsor-copy">
          <p class="eyebrow" data-i18n="home.sponsors.eyebrow"></p>
          <h2 data-i18n="home.sponsors.title"></h2>
          <p data-i18n="home.sponsors.text"></p>
          <a class="text-link section-cta" href="./guia-local.html#parceiros" data-i18n="home.sponsors.link"></a>
        </div>
        <div class="sponsor-grid">
          <a class="sponsor-card" href="./guia-local.html">
            <img
              src="./assets/images/partners/ramadinha_1.jpg"
              alt=""
              data-i18n-attr='{"alt":"home.sponsors.card1Alt"}'
            />
            <p data-i18n="home.sponsors.card1"></p>
          </a>
          <a class="sponsor-card" href="./guia-local.html">
            <img
              src="./assets/images/partners/corga_1.jpg"
              alt=""
              data-i18n-attr='{"alt":"home.sponsors.card2Alt"}'
            />
            <p data-i18n="home.sponsors.card2"></p>
          </a>
          <a class="sponsor-card" href="./guia-local.html">
            <img
              src="./assets/images/partners/cruzeiro_1.jpg"
              alt=""
              data-i18n-attr='{"alt":"home.sponsors.card3Alt"}'
            />
            <p data-i18n="home.sponsors.card3"></p>
          </a>
          <a class="sponsor-card" href="./guia-local.html">
            <img
              src="./assets/images/partners/aquapura_1.jpg"
              alt=""
              data-i18n-attr='{"alt":"home.sponsors.card4Alt"}'
            />
            <p data-i18n="home.sponsors.card4"></p>
          </a>
        </div>
      </div>
    </section>
  </main>

  <div data-site-footer></div>
  <div data-sticky-booking></div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
