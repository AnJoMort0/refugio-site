<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="bookingSentPage.meta.title"></title>
  <meta
    name="description"
    content=""
    data-i18n-attr='{"content":"bookingSentPage.meta.description"}'
  />
  <link rel="stylesheet" href="./css/reset.css" />
  <link rel="stylesheet" href="./css/variables.css" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/mobile.css" />
  <link rel="stylesheet" href="./css/pages/reservas.css" />
  <link rel="stylesheet" href="./css/pages/reserva-enviada.css" />
</head>
<body data-page="booking-sent">
  <div data-site-header></div>

  <main class="booking-sent-page">
    <section class="section booking-sent-hero">
      <div class="container content-column">
        <p class="eyebrow" data-i18n="bookingSentPage.hero.eyebrow"></p>
        <h1 data-i18n="bookingSentPage.hero.title"></h1>
        <p data-i18n="bookingSentPage.hero.text"></p>
      </div>
    </section>

    <section class="section booking-sent-section">
      <div class="container booking-sent-layout">
        <section class="booking-card booking-card-primary booking-sent-summary-card">
          <div class="booking-card-header">
            <p class="eyebrow" data-i18n="bookingSentPage.summary.eyebrow"></p>
            <h2 data-i18n="bookingSentPage.summary.title"></h2>
            <p data-i18n="bookingSentPage.summary.text"></p>
          </div>

          <div id="booking-sent-empty" class="field-warning" hidden>
            <strong data-i18n="bookingSentPage.summary.emptyTitle"></strong>
            <p data-i18n="bookingSentPage.summary.emptyText"></p>
          </div>

          <div id="booking-sent-content">
            <dl class="summary-breakdown booking-sent-breakdown">
              <div>
                <dt data-i18n="bookingSentPage.summary.reservationIdLabel"></dt>
                <dd id="sent-reservation-id">-</dd>
              </div>
              <div>
                <dt data-i18n="bookingSentPage.summary.checkinLabel"></dt>
                <dd id="sent-checkin">-</dd>
              </div>
              <div>
                <dt data-i18n="bookingSentPage.summary.checkoutLabel"></dt>
                <dd id="sent-checkout">-</dd>
              </div>
              <div>
                <dt data-i18n="bookingSentPage.summary.nightsLabel"></dt>
                <dd id="sent-nights">0</dd>
              </div>
              <div>
                <dt data-i18n="bookingSentPage.summary.guestsLabel"></dt>
                <dd id="sent-guests">0</dd>
              </div>
              <div class="summary-subrow">
                <dt data-i18n="bookingSentPage.summary.adultsLabel"></dt>
                <dd id="sent-adults">0</dd>
              </div>
              <div class="summary-subrow">
                <dt data-i18n="bookingSentPage.summary.kidsLabel"></dt>
                <dd id="sent-kids">0</dd>
              </div>
              <div id="sent-bed-row" hidden>
                <dt data-i18n="bookingSentPage.summary.bedPreferenceLabel"></dt>
                <dd id="sent-bed">-</dd>
              </div>
              <div>
                <dt data-i18n="bookingSentPage.summary.depositLabel"></dt>
                <dd id="sent-deposit"></dd>
              </div>
              <div id="sent-bikes-row" hidden>
                <dt data-i18n="bookingSentPage.summary.bikeDaysTitle"></dt>
                <dd id="sent-bikes">-</dd>
              </div>
              <div id="sent-discount-row" hidden>
                <dt data-i18n="bookingSentPage.summary.discountLabel"></dt>
                <dd id="sent-discount">-</dd>
              </div>
              <div>
                <dt data-i18n="bookingSentPage.summary.contactNameLabel"></dt>
                <dd id="sent-contact-name">-</dd>
              </div>
              <div>
                <dt data-i18n="bookingSentPage.summary.emailLabel"></dt>
                <dd id="sent-email">-</dd>
              </div>
              <div id="sent-phone-row" hidden>
                <dt data-i18n="bookingSentPage.summary.phoneLabel"></dt>
                <dd id="sent-phone">-</dd>
              </div>
              <div id="sent-checkin-time-row" hidden>
                <dt data-i18n="bookingSentPage.summary.checkinTimeLabel"></dt>
                <dd id="sent-checkin-time">-</dd>
              </div>
              <div id="sent-checkout-time-row" hidden>
                <dt data-i18n="bookingSentPage.summary.checkoutTimeLabel"></dt>
                <dd id="sent-checkout-time">-</dd>
              </div>
            </dl>

            <div class="summary-total booking-sent-total">
              <span data-i18n="bookingSentPage.summary.estimatedTotalLabel"></span>
              <strong id="sent-total">0€</strong>
            </div>

            <p id="sent-deposit-note" class="summary-note" data-i18n="bookingSentPage.summary.depositNote" hidden></p>

            <div class="booking-sent-detail-grid">
              <section id="sent-child-ages-card" class="booking-sent-detail-card" hidden>
                <h3 data-i18n="bookingSentPage.summary.childAgesTitle"></h3>
                <ul id="sent-child-ages" class="booking-sent-list"></ul>
              </section>
            </div>

            <section id="sent-comments-card" class="booking-sent-detail-card" hidden>
              <h3 data-i18n="bookingSentPage.summary.commentsTitle"></h3>
              <p id="sent-comments">-</p>
            </section>
          </div>
        </section>

        <aside class="booking-sent-sidebar">
          <section class="booking-card booking-sent-notice-card">
            <div class="booking-card-header">
              <p class="eyebrow" data-i18n="bookingSentPage.notice.eyebrow"></p>
              <h2 data-i18n="bookingSentPage.notice.title"></h2>
            </div>
            <div class="field-warning booking-sent-warning">
              <strong data-i18n="bookingSentPage.notice.warningTitle"></strong>
              <p data-i18n="bookingSentPage.notice.warningText"></p>
            </div>
            <ul class="booking-highlight-list">
              <li data-i18n="bookingSentPage.notice.item1"></li>
            </ul>
          </section>

          <section class="booking-card booking-sent-actions-card">
            <div class="booking-card-header">
              <p class="eyebrow" data-i18n="bookingSentPage.actions.eyebrow"></p>
              <h2 data-i18n="bookingSentPage.actions.title"></h2>
              <p data-i18n="bookingSentPage.actions.text"></p>
            </div>
            <div class="booking-sent-actions">
              <a class="button booking-contact-button" href="./contacto.html" data-i18n="bookingSentPage.actions.contact"></a>
              <a class="button booking-reset-button" href="./index.html" data-i18n="bookingSentPage.actions.home"></a>
            </div>
          </section>
        </aside>
      </div>
    </section>
  </main>

  <div data-site-footer></div>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
