<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="icon" href="./assets/icons/favicon.svg" type="image/svg+xml" />
  <title data-i18n="guestStay.meta.title"></title>
  <meta name="description" content="" data-i18n-attr='{"content":"guestStay.meta.description"}' />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <link rel="stylesheet" href="./css/reset.css" />
  <link rel="stylesheet" href="./css/variables.css" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/mobile.css" />
  <link rel="stylesheet" href="./css/pages/qr.css" />
</head>
<body class="qr-body" data-page="guest-stay">
  <div data-site-header></div>

  <main class="qr-main" data-qr-page>
    <section class="qr-welcome" id="inicio" aria-labelledby="qr-welcome-title">
      <div class="container qr-container">
        <p class="eyebrow" data-i18n="guestStay.hero.eyebrow"></p>
        <div data-qr-stay-summary>
          <h1 id="qr-welcome-title" data-i18n="guestStay.hero.genericTitle"></h1>
          <p class="qr-lead" data-i18n="guestStay.hero.genericText"></p>
        </div>

        <div class="qr-quick-grid" aria-label="" data-i18n-attr='{"aria-label":"guestStay.quick.label"}'>
          <a class="qr-quick-action" href="#wifi">
            <span class="qr-action-icon" aria-hidden="true"><svg class="lucide-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"></path><path d="M1.42 9a16 16 0 0 1 21.16 0"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><line x1="12" x2="12.01" y1="20" y2="20"></line></svg></span>
            <span data-i18n="guestStay.quick.wifi"></span>
          </a>
          <a class="qr-quick-action" href="#contactos">
            <span class="qr-action-icon" aria-hidden="true"><svg class="lucide-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.11 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.9.32 1.78.59 2.63a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6"></path></svg></span>
            <span data-i18n="guestStay.quick.host"></span>
          </a>
          <a class="qr-quick-action qr-quick-action-danger" href="#emergencia">
            <span class="qr-action-icon" aria-hidden="true"><svg class="lucide-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.46 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg></span>
            <span data-i18n="guestStay.quick.emergency"></span>
          </a>
          <a class="qr-quick-action" href="#perto">
            <span class="qr-action-icon" aria-hidden="true"><svg class="lucide-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"></path><circle cx="12" cy="10" r="3"></circle></svg></span>
            <span data-i18n="guestStay.quick.nearby"></span>
          </a>
        </div>
      </div>
    </section>

    <section class="qr-section qr-emergency-section" id="emergencia" aria-labelledby="qr-emergency-title">
      <div class="container qr-container">
        <div class="qr-section-heading">
          <p class="eyebrow" data-i18n="guestStay.emergency.eyebrow"></p>
          <h2 id="qr-emergency-title" data-i18n="guestStay.emergency.title"></h2>
          <p data-i18n="guestStay.emergency.text"></p>
        </div>
        <a class="qr-emergency-primary" href="tel:112">
          <span class="qr-emergency-number">112</span>
          <span><strong data-i18n="guestStay.emergency.nationalTitle"></strong><small data-i18n="guestStay.emergency.nationalText"></small></span>
          <span class="qr-call-chip" data-i18n="guestStay.actions.call"></span>
        </a>
        <div class="qr-card-list" data-qr-emergency-list></div>
        <details class="qr-details card qr-medical-details">
          <summary data-i18n="guestStay.emergency.medicalMore"></summary>
          <p class="qr-details-intro" data-i18n="guestStay.emergency.medicalText"></p>
          <div class="qr-card-list qr-card-list-compact" data-qr-medical-list></div>
        </details>
        <div class="qr-property-location card">
          <div>
            <span class="qr-kicker" data-i18n="guestStay.property.label"></span>
            <strong data-site-value="address"></strong>
            <small data-i18n="guestStay.property.emergencyHint"></small>
          </div>
          <div class="qr-inline-actions">
            <button class="qr-mini-button" type="button" data-site-copy="address"><svg class="lucide-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></svg><span data-i18n="guestStay.actions.copyAddress"></span></button>
            <a class="qr-mini-button" href="#" data-site-link="maps" target="_blank" rel="noopener"><svg class="lucide-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"></path><path d="M10 14 21 3"></path><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path></svg><span data-i18n="guestStay.actions.directionsHome"></span></a>
          </div>
        </div>
      </div>
    </section>

    <section class="qr-section" id="contactos" aria-labelledby="qr-hosts-title">
      <div class="container qr-container">
        <div class="qr-section-heading">
          <p class="eyebrow" data-i18n="guestStay.hosts.eyebrow"></p>
          <h2 id="qr-hosts-title" data-i18n="guestStay.hosts.title"></h2>
          <p data-i18n="guestStay.hosts.text"></p>
        </div>
        <div class="qr-host-grid" data-qr-hosts></div>
      </div>
    </section>

    <section class="qr-section qr-alt" id="wifi" aria-labelledby="qr-wifi-title">
      <div class="container qr-container">
        <div class="qr-section-heading"><p class="eyebrow" data-i18n="guestStay.wifi.eyebrow"></p><h2 id="qr-wifi-title" data-i18n="guestStay.wifi.title"></h2></div>
        <div class="qr-wifi-card card" data-qr-wifi></div>
      </div>
    </section>

    <section class="qr-section qr-alt" id="perto" aria-labelledby="qr-nearby-title">
      <div class="container qr-container">
        <div class="qr-section-heading">
          <p class="eyebrow" data-i18n="guestStay.nearby.eyebrow"></p>
          <h2 id="qr-nearby-title" data-i18n="guestStay.nearby.title"></h2>
          <p data-i18n="guestStay.nearby.text"></p>
        </div>
        <div class="qr-nearby-switcher" role="tablist" aria-label="" data-i18n-attr='{"aria-label":"guestStay.nearby.tabsLabel"}'>
          <button class="qr-tab is-active" type="button" role="tab" aria-selected="true" data-qr-tab="food" data-i18n="guestStay.nearby.food"></button>
          <button class="qr-tab" type="button" role="tab" aria-selected="false" data-qr-tab="supermarkets" data-i18n="guestStay.nearby.supermarkets"></button>
          <button class="qr-tab" type="button" role="tab" aria-selected="false" data-qr-tab="services" data-i18n="guestStay.nearby.services"></button>
        </div>
        <div class="qr-nearby-panel" data-qr-panel="food"><div class="qr-place-list" data-qr-food></div></div>
        <div class="qr-nearby-panel" data-qr-panel="supermarkets" hidden><div class="qr-place-list" data-qr-supermarkets></div></div>
        <div class="qr-nearby-panel" data-qr-panel="services" hidden><div class="qr-place-list" data-qr-services></div></div>
        <p class="qr-muted-note" data-i18n="guestStay.nearby.hoursNote"></p>
      </div>
    </section>

    <section class="qr-section qr-partners-section" id="parceiros" aria-labelledby="qr-partners-title">
      <div class="container qr-container"><div class="qr-section-heading"><p class="eyebrow" data-i18n="guestStay.partners.eyebrow"></p><h2 id="qr-partners-title" data-i18n="guestStay.partners.title"></h2><p data-i18n="guestStay.partners.text"></p></div></div>
      <div class="qr-partner-rail" data-qr-sponsors></div>
      <div class="container qr-container"><a class="button button-primary qr-wide-button" href="./guia-local.html#parceiros" data-i18n="guestStay.partners.cta"></a></div>
    </section>

    <section class="qr-section qr-alt" id="bicicletas" data-qr-bike-section aria-labelledby="qr-bikes-title">
      <div class="container qr-container">
        <div class="qr-section-heading"><p class="eyebrow" data-i18n="guestStay.bikes.eyebrow"></p><h2 id="qr-bikes-title" data-i18n="guestStay.bikes.title"></h2></div>
        <div class="qr-bike-card card" data-qr-bike></div>
      </div>
    </section>

    <section class="qr-section" id="casa" aria-labelledby="qr-house-title">
      <div class="container qr-container">
        <div class="qr-section-heading">
          <p class="eyebrow" data-i18n="guestStay.house.eyebrow"></p>
          <h2 id="qr-house-title" data-i18n="guestStay.house.title"></h2>
          <p data-i18n="guestStay.house.text"></p>
          <a class="qr-section-link" href="#regras-estadia" data-open-stay-rules data-i18n="guestStay.house.rulesLink"></a>
        </div>
        <div class="qr-details-stack">
          <details class="qr-details card" open>
            <summary data-i18n="guestStay.house.checkoutTitle"></summary>
            <ul class="qr-instruction-list">
              <li><strong data-i18n="guestStay.house.checkoutTime"></strong><span data-qr-checkout-time></span></li>
              <li data-i18n="guestStay.house.keysInstruction"></li>
              <li><span data-i18n="guestStay.house.wasteInstruction"></span> <a href="#" data-site-link="checkoutWaste" target="_blank" rel="noopener" data-i18n="guestStay.house.wasteMapLink"></a></li>
              <li data-i18n="guestStay.house.kitchenInstruction"></li>
            </ul>
          </details>
          <details class="qr-details card" id="regras-estadia">
            <summary data-i18n="guestStay.house.rulesTitle"></summary>
            <div class="qr-full-rules" data-qr-full-rules></div>
          </details>
        </div>
      </div>
    </section>

    <section class="qr-section qr-guide-cta" id="guia" aria-labelledby="qr-guide-title">
      <div class="container qr-container">
        <p class="eyebrow" data-i18n="guestStay.guide.eyebrow"></p><h2 id="qr-guide-title" data-i18n="guestStay.guide.title"></h2><p data-i18n="guestStay.guide.text"></p>
        <a class="button button-primary qr-wide-button" href="./guia-local.html" data-i18n="guestStay.guide.cta"></a>
        <p class="qr-updated"><span data-i18n="guestStay.updatedLabel"></span> <time datetime="2026-08-25">25/08/2026</time></p>
      </div>
    </section>
  </main>

  <nav class="qr-bottom-nav" aria-label="" data-i18n-attr='{"aria-label":"guestStay.bottomNav.label"}'>
    <a href="#inicio"><span class="qr-bottom-nav-icon" aria-hidden="true"><svg class="lucide-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7"></path><path d="M5 10v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V10"></path><path d="M9 22V12h6v10"></path></svg></span><small data-i18n="guestStay.bottomNav.home"></small></a>
    <a href="#emergencia"><span class="qr-bottom-nav-icon" aria-hidden="true"><svg class="lucide-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg></span><small data-i18n="guestStay.bottomNav.help"></small></a>
    <a href="#wifi"><span class="qr-bottom-nav-icon" aria-hidden="true"><svg class="lucide-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"></path><path d="M1.42 9a16 16 0 0 1 21.16 0"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><line x1="12" x2="12.01" y1="20" y2="20"></line></svg></span><small data-i18n="guestStay.bottomNav.wifi"></small></a>
    <a href="#perto"><span class="qr-bottom-nav-icon" aria-hidden="true"><svg class="lucide-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"></path><circle cx="12" cy="10" r="3"></circle></svg></span><small data-i18n="guestStay.bottomNav.nearby"></small></a>
    <a href="#guia"><span class="qr-bottom-nav-icon" aria-hidden="true"><svg class="lucide-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18 3 21V6l6-3 6 3 6-3v15l-6 3-6-3Z"></path><path d="M9 3v15"></path><path d="M15 6v15"></path></svg></span><small data-i18n="guestStay.bottomNav.guide"></small></a>
  </nav>

  <div data-site-footer></div>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
