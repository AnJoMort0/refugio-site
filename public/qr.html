  <!--
    PROTOTYPE + FUTURE PRODUCTION DATA ARCHITECTURE
    ------------------------------------------------
    PROTOTYPE:
      qr.js now reads the CURRENT reservation through ./js/services/guest-stay-provider.js.
      That provider reads the same same-origin localStorage state used by the admin prototype:
      "refugio-admin-prototype-state-v1".

      It selects the active reservation using the same rule as the admin dashboard:
      status is confirmed/checked_in, check-in <= today, and check-out > today.
      It then exposes only a small guest-facing projection to this page: guest name,
      stay/check-out dates and times, guest count, preferred language, and bicycle extras.

      This only works when admin.html and qr.html are served from the SAME ORIGIN and opened
      in the SAME BROWSER PROFILE. It is intentionally a prototype bridge, not production security.

    PRODUCTION:
      1. Move reservation data to a private server-side database.
      2. Give each stay an unguessable, expiring/revocable token (or signed link).
      3. Replace the internals of guest-stay-provider.js with a call to a guest-safe API.
      4. The API validates the stay and returns ONLY the minimal guest-facing projection.
      5. Never return payment data, owner/internal notes, other reservations, admin data,
         contact history, or the guest directory.
      6. A static QR/NFC tag can continue to open a generic version when no valid stay token exists.

    Keeping the provider isolated means the future database migration should not require
    redesigning this page or its rendering logic.
  -->
